# Публикует Flutter Web на Firebase Hosting (работает и с приватным репозиторием).
# Один раз на СВОЁМ GitHub: Settings → Secrets → FIREBASE_TOKEN (firebase login:ci).
# ID проекта Firebase — в файле .firebaserc (поле default).
# URL после деплоя: https://<ваш-project-id>.web.app
name: Deploy Web to Firebase Hosting

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FIREBASE_TOKEN
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Add FIREBASE_TOKEN secret (run: firebase login:ci) in Settings -> Secrets -> Actions"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v14.4.0
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
